<script>
/* Dentro un iframe: il gioco prende l'altezza del suo contenuto e la comunica alla pagina madre
   con postMessage({ type: "calcio-di-punizione-height", height }). */
(function () {
  var TYPE = "calcio-di-punizione-height";
  var framed = false;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (!framed) return;
  document.documentElement.classList.add("embed");
  var last = 0;
  function send() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (!h || h === last) return;
    last = h;
    try { window.parent.postMessage({ type: TYPE, height: h }, "*"); } catch (e) { /* niente */ }
  }
  function start() {
    send();
    if ("ResizeObserver" in window) {
      var ro = new ResizeObserver(send);
      ro.observe(document.documentElement);
      ro.observe(document.body);
    } else {
      setInterval(send, 500);
    }
    window.addEventListener("load", send);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;margin:0}
body{background:#070910}
.app{
  --bg:#070910;--text:#fff;--muted:#97a1bd;--faint:#5d6684;--brand:#7b86a8;
  --line:rgba(255,255,255,.1);--panel:rgba(255,255,255,.045);--panel-2:rgba(255,255,255,.08);
  --ok:#2fd98a;--ko:#ff5470;--gold:#ffb01f;
  --g1:#16203a;--g2:#241428;
  min-height:100dvh;height:100dvh;overflow:hidden;position:relative;
  background:
    radial-gradient(90% 60% at 10% 0%, var(--g1) 0%, rgba(7,9,16,0) 60%),
    radial-gradient(90% 60% at 90% 100%, var(--g2) 0%, rgba(7,9,16,0) 60%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;
}
.app[data-theme="light"]{
  --bg:#f4f6fb;--text:#0d1222;--muted:#5a6482;--faint:#8b93ab;--brand:#6a7494;
  --line:rgba(13,18,34,.1);--panel:#ffffff;--panel-2:#eef1f7;
  --ok:#12a866;--ko:#e8335a;--gold:#d98a00;
  --g1:#dfe7fb;--g2:#fbe3ea;
  background:
    radial-gradient(90% 60% at 10% 0%, var(--g1) 0%, rgba(244,246,251,0) 60%),
    radial-gradient(90% 60% at 90% 100%, var(--g2) 0%, rgba(244,246,251,0) 60%),
    var(--bg);
}
button{font-family:inherit}
button:focus-visible,.pad:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top-btns{position:absolute;top:12px;right:12px;z-index:20;display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:16px;cursor:pointer;display:grid;place-items:center}
.lang{display:flex;height:38px;padding:3px;gap:2px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.lang-b{min-width:30px;padding:0 6px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;font-weight:900;letter-spacing:.04em;cursor:pointer}
.lang-b.on{background:linear-gradient(135deg,var(--ko),var(--gold));color:#190b10}

/* ---------- HOME ---------- */
.home{flex:1;display:flex;flex-direction:column;justify-content:safe center;padding:64px 22px 28px;gap:4px;overflow-y:auto;max-width:520px;width:100%;margin:0 auto}
.brand{font-size:11px;letter-spacing:.28em;color:var(--brand);font-weight:700}
.title{font-size:clamp(34px,10vw,54px);line-height:1;margin:10px 0 0;font-weight:800;letter-spacing:-.03em}
.amp{background:linear-gradient(90deg,#ff5470,#ffb01f);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.tagline{color:var(--muted);font-size:14px;margin:12px 0 18px;line-height:1.45}
.sect{font-size:10.5px;letter-spacing:.2em;color:var(--faint);font-weight:800;margin:14px 0 8px}
.daily-card,.mode-card{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:16px;border-radius:18px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);cursor:pointer;text-align:left;
  transition:transform .15s ease,background .15s ease;
}
.daily-card{border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--ko) 12%,transparent),color-mix(in srgb,var(--gold) 10%,transparent))}
.daily-card:active,.mode-card:active{transform:scale(.98)}
.daily-ico,.mode-icon{font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--panel-2);flex:0 0 auto}
.daily-body,.mode-text{flex:1;min-width:0}
.daily-h,.mode-label{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.daily-s,.mode-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.pill{font-size:9.5px;letter-spacing:.12em;font-weight:900;padding:3px 7px;border-radius:999px;background:var(--gold);color:#190b10}
.daily-go,.mode-go{font-size:26px;color:var(--faint)}
.modes{display:flex;flex-direction:column;gap:12px}
.mode-rec{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
.how{display:flex;flex-direction:column;gap:8px}
.how-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);line-height:1.35}
.how-row b{color:var(--text)}
.how-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--panel-2);color:var(--text);flex:0 0 auto}
.foot{margin-top:22px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.5}
.all-games{display:block;width:100%;margin-top:16px;padding:14px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--panel);color:var(--text);text-align:center;text-decoration:none;font-size:clamp(13px,3.7vw,15px);font-weight:800;white-space:nowrap;letter-spacing:-.005em}
.all-games:hover{background:var(--panel-2)}
.all-games:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- GIOCO ---------- */
.game{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:820px;margin:0 auto}
.hud{display:flex;align-items:center;gap:8px;padding:12px 170px 2px 10px;min-height:52px}
.hud-back{background:none;border:0;color:var(--muted);font-size:28px;line-height:1;cursor:pointer;padding:0 6px}
.hud-mode{font-size:11.5px;color:var(--muted);font-weight:700;flex:1;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.hud-score{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 6px 14px;min-height:24px}
.hud-right{display:flex;align-items:center;gap:10px}
.hud-pts{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.hud-pts b{font-size:18px;color:var(--text);font-weight:900;font-variant-numeric:tabular-nums}
.hud-goals{font-size:12px;font-weight:800;white-space:nowrap}
.hud-mult{font-size:12px;font-weight:900;color:#190b10;background:linear-gradient(135deg,var(--ko),var(--gold));padding:3px 8px;border-radius:999px;white-space:nowrap;animation:pop2 .3s ease}
@keyframes pop2{from{transform:scale(.6)}to{transform:scale(1)}}
.matchup{display:flex;align-items:center;gap:8px;padding:0 10px 8px;min-width:0}
.mu-shooter{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;font-size:12px}
.mu-foot{font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.mu-name{font-size:13.5px;font-weight:900;overflow-wrap:anywhere}
.mu-stat{font-size:9.5px;font-weight:800;color:var(--faint);letter-spacing:.06em;white-space:nowrap}
.mu-stat i{font-style:normal;color:var(--gold);letter-spacing:1px;font-size:11px}
.mu-keeper{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.mu-keeper.k-gigante,.mu-keeper.k-agile,.mu-keeper.k-anticipa{border-color:color-mix(in srgb,var(--ko) 45%,transparent);color:var(--ko)}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.app[data-theme="light"] .dot{background:rgba(13,18,34,.16)}
.dot.ok{background:var(--ok)!important}
.dot.ko{background:var(--ko)!important}
.dot.now{box-shadow:0 0 0 2px var(--panel-2);background:var(--muted)!important}

.stage{flex:1;position:relative;min-height:0;margin:0 10px;-webkit-user-select:none;user-select:none;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.scn{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.scn-chip{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#fff;padding:5px 9px;border-radius:999px;background:rgba(7,9,16,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
.wind-arrow{display:inline-block;color:#ffb01f;font-weight:900;transition:transform .3s}

.result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 20px;border-radius:20px;background:rgba(7,9,16,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);color:#fff;animation:pop .35s cubic-bezier(.2,1.4,.4,1);width:min(300px,calc(100% - 24px));text-align:center}
.result-t{font-size:clamp(30px,9vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1}
.result.ok .result-t{color:#2fd98a}
.result.ko .result-t{color:#ff5470}
.result.gold .result-t{color:#ffb01f}
.result-s{font-size:12.5px;color:#c3cbe0;font-weight:600}
.result-line{font-size:12.5px;font-style:italic;color:#ffd27a;font-weight:700}
.tag.hot{background:linear-gradient(135deg,#ff5470,#ffb01f);color:#190b10;border:0}
.unlocks{width:100%;display:flex;flex-direction:column;gap:5px;margin-top:6px}
.unlock{display:flex;align-items:center;gap:8px;text-align:left;font-size:11.5px;padding:7px 9px;border-radius:12px;background:rgba(47,217,138,.14);border:1px solid rgba(47,217,138,.4);animation:pop2 .4s ease}
.ul-ico{font-size:18px}
.result-pts{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px}
.result-total{font-size:20px;font-weight:900;color:#ffb01f;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tag{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:rgba(255,176,31,.14);color:#ffd27a;border:1px solid rgba(255,176,31,.3)}
.result-btn{margin-top:8px;width:100%}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

.cv.aiming{cursor:crosshair}
.panel{display:flex;flex-direction:column;gap:8px;padding:10px 10px calc(12px + env(safe-area-inset-bottom))}
.steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.st-chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--faint);padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.st-n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--panel-2);color:var(--muted)}
.st-chip.on{color:var(--text);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.st-chip.on .st-n{background:var(--gold);color:#190b10}
.st-chip.done{color:var(--muted)}
.st-chip.done .st-n{background:var(--ok);color:#06170e}
.re-aim{margin-left:auto;font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;white-space:nowrap}
.meter-zone{display:flex;flex-direction:column;gap:7px;width:100%;min-height:78px;justify-content:center;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-align:left;font:inherit;cursor:pointer;touch-action:manipulation}
.meter-zone.msg{flex-direction:row;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);cursor:default}
.meter-zone.msg b{color:var(--text)}
.big-ico{font-size:24px}
.meter-zone.brief{flex-direction:column;align-items:stretch;gap:6px}
.brief-main{display:flex;align-items:center;gap:10px}
.brief-list{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);line-height:1.35;padding-left:34px}
.curl-bar.nat-l{background:linear-gradient(90deg,#ff5470,rgba(255,176,31,.4) 40%,rgba(255,255,255,.12) 50%,rgba(255,176,31,.14) 60%,rgba(255,84,112,.35))}
.curl-bar.nat-r{background:linear-gradient(90deg,rgba(255,84,112,.35),rgba(255,176,31,.14) 40%,rgba(255,255,255,.12) 50%,rgba(255,176,31,.4) 60%,#ff5470)}
.coll{flex:1;overflow-y:auto;padding:62px 18px 28px;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.coll-top{display:flex;align-items:center;gap:8px}
.coll-h{margin:4px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.gear-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.gear{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font:inherit}
.gear.on{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.gear.lock{opacity:.45;cursor:default}
.g-ball{position:relative;width:34px;height:34px;border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.g-ball span{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%}
.g-boot{width:42px;height:18px;border-radius:12px 18px 6px 6px;border-bottom:4px solid;margin:8px 0}
.g-l{font-size:11px;font-weight:800;text-align:center}
.achs{display:flex;flex-direction:column;gap:6px}
.ach{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);opacity:.7}
.ach.ok{opacity:1;border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.ach-ico{font-size:22px;width:28px;text-align:center}
.ach-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.ach-t b{font-size:13.5px;color:var(--text)}
.ach-r{font-size:11px;font-weight:800;color:var(--gold);text-align:right;max-width:40%}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);min-width:0}
.tile-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800}
.tile-v{font-size:22px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile-s{font-size:11px;color:var(--muted);font-weight:600;line-height:1.3}
.split{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.split-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--panel-2)}
.split-leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted);font-weight:700}
.split-leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mz-h{font-size:12.5px;color:var(--muted);font-weight:600}
.mz-h b{color:var(--text);font-weight:900}
.mz-sub{color:var(--faint)}
.mz-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-weight:700}
.curl-bar{position:relative;height:20px;border-radius:999px;background:linear-gradient(90deg,#ff5470,rgba(255,176,31,.35) 40%,rgba(255,255,255,.12) 50%,rgba(255,176,31,.35) 60%,#ff5470)}
.curl-mid{position:absolute;left:50%;top:3px;bottom:3px;width:2px;margin-left:-1px;background:var(--text);opacity:.5}
.curl-mark{position:absolute;top:-4px;width:12px;height:28px;margin-left:-6px;border-radius:6px;background:#fff;border:3px solid #0d1222;box-shadow:0 2px 8px rgba(0,0,0,.4);left:50%}
.pow-bar{position:relative;height:20px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.pow-green{position:absolute;left:42%;width:16%;top:0;bottom:0;background:rgba(47,217,138,.35);border-left:2px solid #2fd98a;border-right:2px solid #2fd98a}
.pow-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffb01f;opacity:.9;border-radius:999px}
.pw{width:100%;display:flex;flex-direction:column;gap:5px;margin-top:6px}
.pw-bar{position:relative;height:8px;border-radius:999px;background:linear-gradient(90deg,#ffb01f,#ffb01f 42%,#2fd98a 42%,#2fd98a 58%,#ff5470 58%,#ff5470);opacity:.9}
.pw-mark{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px rgba(7,9,16,.8)}
.pw-t{font-size:11px;color:#c3cbe0;font-weight:700}

/* ---------- FINE ---------- */
.over{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:62px 22px 28px;text-align:center;overflow-y:auto}
.over-icon{font-size:40px}
.over-label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:6px}
.over-streak{font-size:clamp(64px,20vw,96px);font-weight:900;line-height:1;letter-spacing:-.05em;margin-top:6px;background:linear-gradient(135deg,var(--ko),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.over-sub{font-size:13px;color:var(--muted);margin-top:4px}
.over-badge{margin-top:15px;font-size:12.5px;font-weight:800;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);background:color-mix(in srgb,var(--gold) 12%,transparent);padding:7px 15px;border-radius:999px}
.over-badge.muted{color:var(--muted);border-color:var(--line);background:var(--panel);font-weight:600}
.grid{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap;justify-content:center;max-width:320px;font-size:22px}
.recap{margin-top:16px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:5px;text-align:left;max-height:30vh;overflow-y:auto}
.rc{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:7px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.rc-m{width:14px;flex:0 0 auto;font-weight:900}
.rc-m.ok{color:var(--ok)}
.rc-m.ko{color:var(--ko)}
.rc-t{flex:1;min-width:0;line-height:1.35}
.rc-v{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;font-weight:800}
.over-actions{margin-top:22px;display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px}
.big{padding:14px;border-radius:14px;font-size:14.5px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);transition:transform .12s ease}
.big:active{transform:scale(.98)}
.big.primary{background:linear-gradient(135deg,var(--ko),var(--gold));border:0;color:#190b10}


/* ---------- CARRIERA ---------- */
.mu-form{font-size:10px;font-weight:900;padding:3px 7px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.mu-form.low{background:color-mix(in srgb,var(--ko) 18%,transparent);color:var(--ko)}
.mu-form.high{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.gust{font-size:9.5px;font-weight:900;color:#ffb01f;margin-left:4px;text-transform:uppercase;letter-spacing:.06em}
.timer{position:absolute;top:44px;right:8px;font-size:15px;font-weight:900;color:#fff;padding:6px 11px;border-radius:999px;background:rgba(7,9,16,.7);border:1px solid rgba(255,255,255,.2);font-variant-numeric:tabular-nums;pointer-events:none}
.timer.urgent{background:#e8334f;border-color:#ff8fa1;animation:pulseT .5s ease-in-out infinite alternate}
@keyframes pulseT{from{transform:scale(1)}to{transform:scale(1.08)}}
.card-msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:14px;font-weight:900;color:#190b10;padding:12px 16px;border-radius:14px;background:#ffd23f;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center;width:max-content;max-width:calc(100% - 30px);animation:pop2 .3s ease;pointer-events:none;z-index:5}
.card-msg.red{background:#e8334f;color:#fff}
.card-msg.info{background:rgba(7,9,16,.85);color:#fff;border:1px solid rgba(255,255,255,.2)}
.form-row2{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:var(--faint);margin-top:4px}
.form-row2 .xp-bar{flex:1}
.form-row2 b{color:var(--text);font-variant-numeric:tabular-nums}
.form-bar span{background:linear-gradient(90deg,#ffb01f,#ffd27a)}
.form-bar span.low{background:var(--ko)}
.form-bar span.high{background:linear-gradient(90deg,var(--ok),#6ef0b0)}
.notes{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:14px;border:1px dashed var(--line)}
.nm-key{font-size:12.5px;font-weight:900;color:var(--ko)}
.next-match.cup{border-color:color-mix(in srgb,#4f8bff 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,#4f8bff 12%,transparent),var(--panel))}
.ev-ico{font-size:48px}
.ev-t{margin:6px 0 0;font-size:24px;font-weight:900;letter-spacing:-.02em}
.ev-d{color:var(--muted);font-size:14px;max-width:340px;margin:8px 0 0;line-height:1.45}
.ev-b{display:flex;flex-direction:column;gap:3px;text-align:left}
.ev-b span{font-size:12px;color:var(--muted);font-weight:700}
.cup-t{font-size:clamp(40px,12vw,64px)}
.verdict.mid{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold)}
.spec-b{font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:var(--panel);color:var(--text);cursor:pointer;white-space:nowrap;margin-left:auto}
.spec-b.on{background:linear-gradient(135deg,var(--ko),var(--gold));color:#190b10;border:0}
.spec-b + .re-aim{margin-left:0}
.contract{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.contract div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);min-width:0}
.contract span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800}
.contract b{font-size:15px;font-weight:900}
.rival{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--ko) 35%,transparent);background:var(--panel)}
.rv-ico{font-size:20px}
.rv-t{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);min-width:0}
.rv-t b{font-size:13.5px;color:var(--text)}
.specs{display:flex;flex-direction:column;gap:6px}
.spec{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);opacity:.65}
.spec.ok{opacity:1;border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.spec-ico{font-size:20px;width:26px;text-align:center}
.spec-t{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);min-width:0}
.spec-t b{font-size:13.5px;color:var(--text)}
.club-b .ct{color:var(--gold);font-weight:800}
.share-card{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:12px}
.sel{font:inherit;font-size:15px;font-weight:800;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.seg.wrap{flex-wrap:wrap}
.seg.wrap .seg-b{flex:1 1 calc(50% - 6px)}
.shop-card{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px;border-radius:18px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--panel);color:var(--text);font:inherit;cursor:pointer;text-align:left}
.wealth-cv{width:100%;max-width:100%;aspect-ratio:640/300;border-radius:16px;display:block;margin-top:10px}
.wealth-cv.sm{width:112px;flex:0 0 auto;margin:0;border-radius:12px}
.wealth-cap{font-size:12px;color:var(--muted);font-weight:700;margin:6px 0 10px}
.shop-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.shop-t b{font-size:15px}
.shop-t span{font-size:12px;color:var(--muted)}
.shop-list{display:flex;flex-direction:column;gap:6px}
.shop-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.shop-row.on{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.sr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.sr-t b{font-size:14px;color:var(--text)}
.shop-row .big.sm{min-width:96px}
.next-match.nat{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.ev-row{display:flex;flex-direction:column;gap:8px}
.share-card img{width:min(100%,320px);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.mi-num{font-size:20px;font-weight:900;color:var(--gold)}
.career-card{border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.mu-num{font-size:12px;font-weight:900;min-width:24px;height:24px;padding:0 5px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ko),var(--gold));color:#190b10}
.xp-gain{font-size:12px;font-weight:900;color:#6ef0b0}
.xp-gain.big-x{font-size:16px;margin-top:12px;color:var(--ok)}
.form-row{display:flex;gap:8px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em}
.fld.grow{flex:1;min-width:0}
.fld.num{width:84px}
.fld input{font:inherit;font-size:16px;font-weight:800;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;letter-spacing:0;-webkit-user-select:text;user-select:text}
.fld input:focus{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:flex;gap:6px;margin-top:8px}
.seg-b{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:800;cursor:pointer}
.seg-b.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.stat-list{display:flex;flex-direction:column;gap:6px}
.stat-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.stat-row.can{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.stat-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted)}
.stat-t b{font-size:14px;color:var(--text)}
.stat-stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
.pm{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stat-row.can .pm{background:linear-gradient(135deg,var(--ko),var(--gold));color:#190b10;border:0}
.pm:disabled{opacity:.35;cursor:default}
.club-pick{display:flex;flex-direction:column;gap:8px}
.club-b{display:flex;flex-direction:column;gap:3px;text-align:left;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;cursor:pointer}
.club-b b{font-size:16px}
.club-b span{font-size:12px;color:var(--muted)}
.club-b.on{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent)}
.club-b.stay{border-style:dashed}
.c-go{margin-top:18px}
.c-go:disabled,.big:disabled{opacity:.5;cursor:default}
.pcard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--ko) 12%,transparent),color-mix(in srgb,var(--gold) 10%,transparent));margin-top:10px}
.pc-num{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--ko),var(--gold));color:#190b10;flex:0 0 auto}
.pc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pc-name{font-size:18px;font-weight:900}
.pc-sub{font-size:12px;color:var(--muted);font-weight:700}
.pc-xp{font-size:11px;color:var(--faint);font-weight:700}
.xp-bar{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.xp-bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ok),#6ef0b0)}
.obj-bar span{background:linear-gradient(90deg,var(--ko),var(--gold))}
.season{display:flex;flex-direction:column;gap:10px}
.obj{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.obj-h{display:flex;gap:6px;font-size:13px;color:var(--muted)}
.obj-h b{color:var(--text)}
.obj-h span{margin-left:auto;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums}
.next-match{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--panel)}
.nm-k{font-size:10.5px;letter-spacing:.18em;color:var(--faint);font-weight:800}
.nm-teams{display:flex;align-items:baseline;gap:10px;font-size:20px;flex-wrap:wrap}
.nm-teams span{font-size:12px;color:var(--faint);font-weight:800}
.nm-sub{font-size:12px;color:var(--muted)}
.recap.wide{max-width:none;max-height:none;margin-top:0}
.reset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:22px;font-size:12px;color:var(--muted)}
.link-b{background:none;border:0;color:var(--faint);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.big.sm{padding:9px 14px;font-size:13px}
.big.danger{background:var(--ko);border:0;color:#fff}
.score{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;width:100%;max-width:420px}
.sc-t{flex:1;min-width:0;font-size:15px;text-align:center;overflow:hidden;text-overflow:ellipsis}
.sc-n{font-size:clamp(48px,15vw,72px);font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;display:flex;gap:8px}
.sc-n span{color:var(--faint)}
.res-pill{margin-top:8px;font-size:13px;font-weight:900;padding:6px 14px;border-radius:999px}
.res-pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.res-pill.mid{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.res-pill.ko{background:color-mix(in srgb,var(--ko) 18%,transparent);color:var(--ko)}
.cm-line{max-width:320px;margin-top:10px}
.verdict{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:800}
.verdict.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.verdict.ko{background:color-mix(in srgb,var(--ko) 13%,transparent);color:var(--ko)}
.table{display:flex;flex-direction:column;flex-shrink:0;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.tr{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:12.5px;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr.me{background:color-mix(in srgb,var(--gold) 16%,transparent);font-weight:900}
.tr-p{width:22px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:800}
.tr-n{flex:1}
.tr-v{font-weight:900;font-variant-numeric:tabular-nums}
/* ---------- DENTRO UN IFRAME ---------- */
html.embed,html.embed body,html.embed #root{height:auto;min-height:0}
html.embed .app{height:auto;min-height:0;overflow:visible}
html.embed .home,html.embed .coll,html.embed .over{flex:none;overflow:visible}
html.embed .home{justify-content:flex-start}
html.embed .game{flex:none;height:clamp(560px,160vw,780px)}
html.embed .recap{max-height:none}

@media (prefers-reduced-motion:reduce){
  .result{animation:none}
}
